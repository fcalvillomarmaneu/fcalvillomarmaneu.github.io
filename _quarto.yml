project:
  type: website
  output-dir: _site
  resources:
    - CVweb.pdf
    - arxiv-logomark-small.svg
    - googlescholar.svg

website:
  title: "Francisco Calvillo"
  site-url: "https://fcalvillomarmaneu.github.io/"
  description: "Academic website of Francisco Calvillo, PhD in Mathematics."
  navbar:
    background: light
    left:
      - text: Home
        href: index.qmd
      - text: Publications
        href: publications.qmd
      - text: Teaching
        href: teaching.qmd
      - text: CV
        href: CVweb.pdf
        target: _blank
      - text: Contact
        href: contact.qmd
    right:
      - text: "![](/googlescholar.svg){height=1.2em}"
        href: https://scholar.google.com/citations?user=7EGKdOsAAAAJ
        target: _blank

      - text: "![](/arxiv-logomark-small.svg){height=1.2em}"
        href: https://arxiv.org/a/calvillo_f_1.html
        target: _blank

      - icon: linkedin
        href: https://www.linkedin.com/in/francisco-calvillo-marmaneu-60202626a/
        target: _blank
  page-footer:
    left: "© 2026 Francisco Calvillo"
  open-graph: true
  back-to-top-navigation: true

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    smooth-scroll: true
